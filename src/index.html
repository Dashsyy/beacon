<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Project Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <input id="search" type="text" placeholder="Filter projects…" autofocus />
    <button id="scanBtn" class="secondary" title="Find projects inside a chosen folder">Scan</button>
    <button id="addBtn" title="Add project folder">+ Add</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="favorites">Favorites</button>
    <button class="tab-btn" data-tab="groups">Groups</button>
  </div>
  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>No projects yet. Click "+ Add" to pick a folder.</p>

  <div id="scanModal" class="modal-overlay" hidden>
    <div class="modal">
      <div id="scanProgressView">
        <h2>Scanning…</h2>
        <p id="scanProgressDir" class="scan-progress-dir"></p>
        <p id="scanProgressCount" class="scan-progress-count"></p>
        <div class="modal-actions">
          <button id="scanAbortBtn" class="secondary">Cancel</button>
        </div>
      </div>
      <div id="scanResultsView" hidden>
        <h2 id="scanModalTitle">Found projects</h2>
        <label class="select-all-row">
          <input type="checkbox" id="selectAllCheckbox" checked />
          Select all
        </label>
        <ul id="scanCandidateList" class="candidate-list"></ul>
        <div class="modal-actions">
          <button id="scanCancelBtn" class="secondary">Cancel</button>
          <button id="scanConfirmBtn">Add Selected</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
